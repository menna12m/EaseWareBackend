[build]
builder = "nixpacks"
buildCommand = "npm run build"

# Migrations run at deploy time so DATABASE_URL is fully resolved.
# Once running, the start command keeps Medusa alive.
#
# Healthcheck removed temporarily — Railway falls back to "process is alive +
# port is responding" which is fine for an MVP and unblocks deploys when
# /health behaves oddly on cold boot. Re-add once everything's stable.
[deploy]
startCommand = "npx medusa db:migrate && npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
